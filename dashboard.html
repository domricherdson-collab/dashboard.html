<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Rolling | Live Multi-Mat Hub & Tournament Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #f59e0b;
            --accent-green: #10b981;
            --danger: #ef4444;
            --bg-light: #f1f5f9;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.5;
            padding-bottom: 3rem;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        nav {
            background: #1e293b;
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            border-bottom: 3px solid var(--accent);
        }

        .nav-btn {
            background: transparent;
            color: #cbd5e1;
            border: none;
            padding: 0.6rem 1.2rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
        }

        .nav-btn.active, .nav-btn:hover {
            background: var(--accent);
            color: #0f172a;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .mats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .mat-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .mat-header {
            background: var(--primary);
            color: white;
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-live { background: var(--accent-green); color: white; }
        .status-pause { background: var(--accent); color: #0f172a; }

        .mat-body { padding: 1.25rem; }

        .timer-bar {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-family: 'Montserrat', sans-serif;
        }

        .timer-time {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .scores-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .player-block {
            text-align: center;
            padding: 0.75rem;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .p-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .p-score {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .vs-divider {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            color: #cbd5e1;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Railway Rolling</h1>
        <p>Live Multi-Mat Court Hub & Tournament Central</p>
    </header>

    <nav>
        <button class="nav-btn active" onclick="showTab('live-mats')">📹 All Live Mats</button>
    </nav>

    <div class="container">
        <div id="live-mats" class="tab-content active">
            <div class="mats-grid">

                <!-- MAT 1 (Synced live with index.html) -->
                <div class="mat-card">
                    <div class="mat-header">
                        <span>🔴 Mat 1 (Main Court)</span>
                        <span class="status-badge status-live" id="m1-status">LIVE</span>
                    </div>
                    <div class="mat-body">
                        <div class="timer-bar">
                            <span id="m1-qtr" style="font-weight: 700; color: #64748b;">Quarter 1</span>
                            <span class="timer-time" id="m1-timer">02:00</span>
                        </div>
                        <div class="scores-row">
                            <div class="player-block">
                                <div class="p-name" id="m1-p1-name">Player A</div>
                                <div class="p-score" id="m1-p1-score">0</div>
                            </div>
                            <div class="vs-divider">VS</div>
                            <div class="player-block">
                                <div class="p-name" id="m1-p2-name">Player B</div>
                                <div class="p-score" id="m1-p2-score">0</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        // Real-time listener for index.html match data
        function listenForLiveMat1Updates() {
            const updateMat1UI = () => {
                const rawData = localStorage.getItem('railway_mat1_data');
                if (!rawData) return;
                const data = JSON.parse(rawData);

                document.getElementById('m1-p1-name').innerText = data.playerA;
                document.getElementById('m1-p2-name').innerText = data.playerB;
                document.getElementById('m1-p1-score').innerText = data.scoreA;
                document.getElementById('m1-p2-score').innerText = data.scoreB;
                document.getElementById('m1-qtr').innerText = data.quarter;

                let mins = Math.floor(data.timeLeft / 60);
                let secs = data.timeLeft % 60;
                document.getElementById('m1-timer').innerText = 
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                const statusBadge = document.getElementById('m1-status');
                statusBadge.innerText = data.status;
                statusBadge.className = data.status === 'LIVE' ? 'status-badge status-live' : 'status-badge status-pause';
            };

            window.addEventListener('storage', (e) => {
                if (e.key === 'railway_mat1_data') {
                    updateMat1UI();
                }
            });

            updateMat1UI();
        }

        listenForLiveMat1Updates();
    </script>
</body>
</html>
